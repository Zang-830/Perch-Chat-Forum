spring:
  datasource:
    url: jdbc:h2:file:./data/campus-community;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
  dev-admin:
    enabled: ${DEV_ADMIN_ENABLED:false}
    username: ${DEV_ADMIN_USERNAME:admin}
    password: ${DEV_ADMIN_PASSWORD:}
