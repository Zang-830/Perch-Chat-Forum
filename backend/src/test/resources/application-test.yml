spring:
  datasource:
    url: jdbc:h2:mem:campus-community-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${random.uuid}${random.uuid}
    expiration-minutes: 60
  upload:
    directory: ./target/test-uploads
    max-image-bytes: 5242880
  storage:
    type: local
