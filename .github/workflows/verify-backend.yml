name: Verify backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/verify-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/verify-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Download dependencies and run tests
        run: mvn --batch-mode --no-transfer-progress -s .mvn/settings.xml test
